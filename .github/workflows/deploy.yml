#Filename: deploy.yml
#Author: Kyle McColgan
#Date: 4 August 2026
#Description: This file contains the GitHub Actions Workflow and GitHub Pages deployment processes for the React timer project.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write  # For push to the gh-pages branch...

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install package dependencies
        run: npm install

      - name: Build the project
        run: npm run build  # Vite outputs to ./dist directory.

      - name: Execute test cases
        run: npm test -- --run #Tell Vitest to execute once and exit rather than hanging in watch mode.

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
